<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据可视化 · 动作变成了什么</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#182225; --ink-soft:#4C5A5C; --ink-faint:#7C8A8B;
    --paper:#E9EDE9; --paper-raised:#FFFFFF; --paper-sunken:#DCE2DC;
    --line:#C7D0C8; --accent:#9C6F27; --accent-soft:#F1E4C8; --accent-strong:#7A5A20;
    --granted:#3E7A54; --denied:#A5493A;
    --font-cjk:'PingFang SC','Microsoft YaHei UI','Noto Sans SC','Hiragino Sans GB',sans-serif;
    --font-mono:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--font-cjk); background:var(--paper); color:var(--ink); padding:24px; -webkit-font-smoothing:antialiased; }
  .wrap{max-width:680px; margin:0 auto;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(20,20,10,0.06), 0 10px 28px -18px rgba(20,20,10,0.28);
  }
  button{ font-family:inherit; font-size:14px; font-weight:600; border:none; border-radius:6px; padding:10px 18px; cursor:pointer; }
  button:hover{opacity:.85;} button:disabled{opacity:.35; cursor:default;}
  .btn-primary{background:var(--accent-strong); color:#fff;}
  canvas{ width:100%; display:block; background:var(--paper-sunken); border-radius:6px; border:1px solid var(--line); }
  .legend{ display:flex; gap:18px; margin-top:10px; font-size:13px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:14px; height:3px; display:inline-block; border-radius:2px; }
  .readout{ display:flex; gap:18px; margin-top:16px; }
  .readout .box{ flex:1; text-align:center; background:var(--paper-sunken); border-radius:8px; padding:14px 8px; }
  .readout .box .v{ font-family:var(--font-mono); font-size:24px; font-weight:700; }
  .readout .box .k{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .error-box{ background:#F2E0DC; color:var(--denied); padding:10px 14px; border-radius:6px; font-size:13.5px; margin-top:8px; }
  .hint{ font-size:12px; color:var(--ink-faint); line-height:1.6; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📈 动作变成了什么？</h1>
  <p class="sub">刚才你用手感觉到了"歪一下、球就滚一下"。现在我们打开电脑的眼睛，看看这个"歪一下"在电脑里到底长什么样——原来就是几个不停跳动的数字。</p>

  <div class="card">
    <button class="btn-primary" id="connectBtn" onclick="connectSerial()">🔌 连接 XIAO 板子</button>
    <span id="connectStatus"></span>
    <div id="connectError"></div>
  </div>

  <div class="card">
    <div class="readout">
      <div class="box"><div class="v" id="valX" style="color:#A5493A;">0.00</div><div class="k">X 轴</div></div>
      <div class="box"><div class="v" id="valY" style="color:#3E7A54;">0.00</div><div class="k">Y 轴</div></div>
      <div class="box"><div class="v" id="valZ" style="color:#2B5D8C;">0.00</div><div class="k">Z 轴</div></div>
    </div>
    <canvas id="liveChart" height="180" style="margin-top:16px;"></canvas>
    <div class="legend">
      <span><i style="background:#A5493A;"></i>X（左右）</span>
      <span><i style="background:#3E7A54;"></i>Y（前后）</span>
      <span><i style="background:#2B5D8C;"></i>Z（上下）</span>
    </div>
    <div class="hint">板子平放不动时，Z轴大约是1、X和Y轴大约是0——那是地球重力一直往下拉着它。试试把板子立起来、翻过来，看看哪条线变了。</div>
  </div>
</div>

<script>
if(location.protocol === 'file:'){
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#A5493A;color:#fff;padding:14px 20px;font-family:monospace;font-size:13px;line-height:1.6;">⚠️ 检测到这个页面是直接双击打开的（file://），Web Serial 在这种情况下连不上设备。请通过本地服务器或 GitHub Pages 打开，例如在这个文件夹里运行 <code>python3 -m http.server 8000</code>，然后浏览器访问 http://localhost:8000</div>'
  );
}

const $ = id => document.getElementById(id);
let port = null, keepReading = true;
let history = [];
const HISTORY_CAP = 250;

async function connectSerial(){
  if(!('serial' in navigator)){
    $('connectError').innerHTML = '<div class="error-box">这个浏览器不支持Web Serial，请换Chrome或Edge浏览器打开这个页面。</div>';
    return;
  }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    $('connectStatus').innerHTML = ' <span style="color:#3E7A54;font-weight:600;">✓ 已连接</span>';
    $('connectBtn').disabled = true;
    readLoop();
  }catch(err){
    $('connectError').innerHTML = `<div class="error-box">连接失败：${err.message}</div>`;
  }
}

async function readLoop(){
  const textDecoder = new TextDecoderStream();
  port.readable.pipeTo(textDecoder.writable);
  const reader = textDecoder.readable.getReader();
  let lineBuf = '';
  while(keepReading){
    const { value, done } = await reader.read();
    if(done) break;
    lineBuf += value;
    const lines = lineBuf.split('\n');
    lineBuf = lines.pop();
    for(const line of lines) handleLine(line.trim());
  }
}

function handleLine(line){
  if(!line || line.startsWith('IMU_')) return;
  const parts = line.split(',');
  if(parts.length !== 3) return;
  const x = parseFloat(parts[0]), y = parseFloat(parts[1]), z = parseFloat(parts[2]);
  if([x,y,z].some(Number.isNaN)) return;
  $('valX').textContent = x.toFixed(2);
  $('valY').textContent = y.toFixed(2);
  $('valZ').textContent = z.toFixed(2);
  history.push([x,y,z]);
  if(history.length > HISTORY_CAP) history.shift();
  drawChart();
}

function drawChart(){
  const canvas = $('liveChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const show = history.slice(-150);
  if(show.length < 2) return;
  const colors = ['#A5493A','#3E7A54','#2B5D8C'];
  for(let axis=0; axis<3; axis++){
    ctx.beginPath();
    ctx.strokeStyle = colors[axis];
    ctx.lineWidth = 1.8;
    show.forEach((s,i) => {
      const px = (i/(show.length-1)) * w;
      const py = h/2 - s[axis] * (h/5);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    });
    ctx.stroke();
  }
}
</script>
</body>
</html>
