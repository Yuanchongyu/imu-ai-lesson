<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的计步器 · 网页教学版</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#182225; --ink-soft:#4C5A5C; --ink-faint:#7C8A8B;
    --paper:#E9EDE9; --paper-raised:#FFFFFF; --paper-sunken:#DCE2DC;
    --line:#C7D0C8; --accent:#9C6F27; --accent-soft:#F1E4C8; --accent-strong:#7A5A20;
    --granted:#3E7A54; --granted-soft:#DEEBE2;
    --denied:#A5493A; --denied-soft:#F2E0DC;
    --font-cjk:'PingFang SC','Microsoft YaHei UI','Noto Sans SC','Hiragino Sans GB',sans-serif;
    --font-mono:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-cjk); background:var(--paper); color:var(--ink);
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}

  .card{
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:10px; padding:20px 22px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(20,20,10,0.06), 0 10px 28px -18px rgba(20,20,10,0.28);
  }
  .card.dim{ opacity:.45; pointer-events:none; }
  .card h2{ font-size:15px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .card h2 .step{
    font-family:var(--font-mono); font-size:11px; background:var(--accent-soft);
    color:var(--accent-strong); padding:2px 8px; border-radius:20px; letter-spacing:.05em;
  }
  .card .desc{ font-size:13px; color:var(--ink-faint); margin:0 0 14px; }

  button{
    font-family:inherit; font-size:14px; font-weight:600; border:none; border-radius:6px;
    padding:10px 18px; cursor:pointer; transition:opacity .15s;
  }
  button:hover{opacity:.85;} button:disabled{opacity:.35; cursor:default;}
  .btn-primary{background:var(--accent-strong); color:#fff;}
  .btn-ghost{background:var(--paper-sunken); color:var(--ink); border:1px solid var(--line);}

  canvas{ width:100%; display:block; background:var(--paper-sunken); border-radius:6px; border:1px solid var(--line); }

  .count-display{
    text-align:center; padding:28px 0;
  }
  .count-display .num{
    font-family:var(--font-mono); font-size:72px; font-weight:700; color:var(--accent-strong); line-height:1;
  }
  .count-display .label{ font-size:13px; color:var(--ink-faint); margin-top:6px; }
  .count-display.flash .num{ color:var(--granted); }

  .slider-row{ display:flex; align-items:center; gap:14px; margin-top:16px; }
  .slider-row label{ font-size:13px; color:var(--ink-soft); flex:none; width:120px; }
  .slider-row input[type=range]{ flex:1; }
  .slider-row .val{ font-family:var(--font-mono); font-size:13px; width:52px; text-align:right; }

  .hint{ font-size:12px; color:var(--ink-faint); line-height:1.6; margin-top:8px; }
  .error-box{ background:var(--denied-soft); color:var(--denied); padding:10px 14px; border-radius:6px; font-size:13.5px; margin-top:8px; }
  .status-ok{ color:var(--granted); font-weight:600; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>👟 我的计步器 · 网页教学版</h1>
  <p class="sub">不用AI，纯粹靠一条"超过某个阈值就算一步"的规则来数数——先搞懂最简单的信号处理，再去碰机器学习。</p>

  <div class="card" id="card-connect">
    <h2><span class="step">STEP 1</span> 连接设备</h2>
    <p class="desc">用Chrome或Edge浏览器打开，板子先烧录好 <code>imu_stream.ino</code>。</p>
    <button class="btn-primary" id="connectBtn" onclick="connectSerial()">🔌 连接 XIAO 板子</button>
    <span id="connectStatus" style="margin-left:10px;"></span>
    <div id="connectError"></div>
  </div>

  <div class="card dim" id="card-count">
    <h2><span class="step">STEP 2</span> 计步</h2>
    <div class="count-display" id="countDisplay">
      <div class="num" id="stepCount">0</div>
      <div class="label">步</div>
    </div>
    <div class="row" style="text-align:center;">
      <button class="btn-ghost" onclick="resetCount()">重置计数</button>
    </div>
  </div>

  <div class="card dim" id="card-chart">
    <h2><span class="step">LIVE</span> 合成加速度 · 阈值线</h2>
    <p class="desc">灰色波形是"总的晃动幅度"（三轴合成），红色横线是判断"算一步"的阈值——晃动波形往上冲过红线，就数一步。</p>
    <canvas id="liveChart" height="140"></canvas>
    <div class="slider-row">
      <label>阈值 (g)</label>
      <input type="range" id="thresholdSlider" min="1.05" max="2.0" step="0.05" value="1.3" oninput="updateThresholdLabel()">
      <span class="val" id="thresholdVal">1.30</span>
    </div>
    <div class="hint">静止不动时，合成加速度大约等于1（重力），所以阈值要设得比1大一些。阈值太低容易把手抖也算成一步，太高又会漏数——你们可以边晃边调，看看多少最准。</div>
  </div>
</div>

<script>
if(location.protocol === 'file:'){
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#A5493A;color:#fff;padding:14px 20px;font-family:monospace;font-size:13px;line-height:1.6;">⚠️ 检测到这个页面是直接双击打开的（file://），Web Serial 在这种情况下连不上设备。请通过本地服务器或 GitHub Pages 打开，例如在这个文件夹里运行 <code>python3 -m http.server 8000</code>，然后浏览器访问 http://localhost:8000</div>'
  );
}

const $ = id => document.getElementById(id);

// ---------------- serial connection ----------------
let port = null;
let keepReading = true;
let history = []; // rolling array of magnitude values
const HISTORY_CAP = 250;

async function connectSerial(){
  if(!('serial' in navigator)){
    $('connectError').innerHTML = '<div class="error-box">这个浏览器不支持Web Serial，请换Chrome或Edge浏览器打开这个页面。</div>';
    return;
  }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    $('connectStatus').innerHTML = '<span class="status-ok">✓ 已连接</span>';
    $('connectBtn').disabled = true;
    $('card-count').classList.remove('dim');
    $('card-chart').classList.remove('dim');
    readLoop();
  }catch(err){
    $('connectError').innerHTML = `<div class="error-box">连接失败：${err.message}</div>`;
  }
}

async function readLoop(){
  const textDecoder = new TextDecoderStream();
  port.readable.pipeTo(textDecoder.writable);
  const reader = textDecoder.readable.getReader();
  let lineBuf = '';
  while(keepReading){
    const { value, done } = await reader.read();
    if(done) break;
    lineBuf += value;
    const lines = lineBuf.split('\n');
    lineBuf = lines.pop();
    for(const line of lines) handleLine(line.trim());
  }
}

function handleLine(line){
  if(!line || line.startsWith('IMU_')) return;
  const parts = line.split(',');
  if(parts.length !== 3) return;
  const x = parseFloat(parts[0]), y = parseFloat(parts[1]), z = parseFloat(parts[2]);
  if([x,y,z].some(Number.isNaN)) return;
  const mag = Math.sqrt(x*x + y*y + z*z);
  history.push(mag);
  if(history.length > HISTORY_CAP) history.shift();
  checkStep(mag);
  drawChart();
}

// ---------------- step detection: 简单阈值规则，不用AI ----------------
let stepCount = 0;
let wasAboveThreshold = false;
let lastStepTime = 0;
const REFRACTORY_MS = 300; // 一步之后，300毫秒内不再数下一步，避免同一下动作被数好几次

function getThreshold(){ return parseFloat($('thresholdSlider').value); }

function checkStep(mag){
  const threshold = getThreshold();
  const now = performance.now();
  const above = mag > threshold;
  if(above && !wasAboveThreshold && (now - lastStepTime) > REFRACTORY_MS){
    stepCount++;
    lastStepTime = now;
    $('stepCount').textContent = stepCount;
    flashCount();
  }
  wasAboveThreshold = above;
}

function flashCount(){
  const el = $('countDisplay');
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 180);
}

function resetCount(){
  stepCount = 0;
  $('stepCount').textContent = '0';
}

function updateThresholdLabel(){
  $('thresholdVal').textContent = getThreshold().toFixed(2);
}

// ---------------- chart ----------------
function drawChart(){
  const canvas = $('liveChart');
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const show = history.slice(-150);
  if(show.length < 2) return;

  // 量程：0.5g 到 2.5g 之间画图
  const minG = 0.5, maxG = 2.5;
  const toY = v => h - ((v - minG) / (maxG - minG)) * h;

  // 阈值横线
  const threshold = getThreshold();
  ctx.beginPath();
  ctx.strokeStyle = '#A5493A';
  ctx.setLineDash([5,4]);
  ctx.lineWidth = 1.4;
  ctx.moveTo(0, toY(threshold));
  ctx.lineTo(w, toY(threshold));
  ctx.stroke();
  ctx.setLineDash([]);

  // 波形
  ctx.beginPath();
  ctx.strokeStyle = '#4C5A5C';
  ctx.lineWidth = 1.8;
  show.forEach((v,i) => {
    const px = (i/(show.length-1)) * w;
    const py = toY(v);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();
}
</script>
</body>
</html>
