<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>倾斜滚球 · IMU开场秀</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#182225; --ink-soft:#4C5A5C; --ink-faint:#7C8A8B;
    --paper:#E9EDE9; --paper-raised:#FFFFFF; --paper-sunken:#DCE2DC;
    --line:#C7D0C8; --accent:#9C6F27; --accent-soft:#F1E4C8; --accent-strong:#7A5A20;
    --granted:#3E7A54; --granted-soft:#DEEBE2;
    --denied:#A5493A;
    --font-cjk:'PingFang SC','Microsoft YaHei UI','Noto Sans SC','Hiragino Sans GB',sans-serif;
    --font-mono:'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-cjk); background:var(--paper); color:var(--ink);
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; text-align:center;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}

  .card{
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:10px; padding:20px 22px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(20,20,10,0.06), 0 10px 28px -18px rgba(20,20,10,0.28);
  }
  button{
    font-family:inherit; font-size:15px; font-weight:600; border:none; border-radius:6px;
    padding:12px 22px; cursor:pointer;
  }
  button:hover{opacity:.85;} button:disabled{opacity:.35; cursor:default;}
  .btn-primary{background:var(--accent-strong); color:#fff;}
  .btn-ghost{background:var(--paper-sunken); color:var(--ink); border:1px solid var(--line);}

  #gameCanvas{
    width:100%; aspect-ratio:1/1; background:var(--paper-sunken); border-radius:10px;
    border:1px solid var(--line); display:block; margin-top:14px;
  }
  .status{ font-size:14px; color:var(--ink-soft); margin-top:10px; min-height:22px; }
  .status.win{ color:var(--granted); font-weight:700; font-size:18px; }
  .error-box{ background:#F2E0DC; color:var(--denied); padding:10px 14px; border-radius:6px; font-size:13.5px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎱 倾斜滚球</h1>
  <p class="sub">拿起板子往哪边歪，球就往哪边滚——把板子当成一个托盘。撞到金色终点就赢。</p>

  <div class="card">
    <button class="btn-primary" id="connectBtn" onclick="connectSerial()">🔌 连接 XIAO 板子，开始玩</button>
    <span id="connectStatus"></span>
    <div id="connectError"></div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div class="status" id="statusText">连接板子后，慢慢倾斜它试试看</div>
    <button class="btn-ghost" style="margin-top:10px;" onclick="resetBall()">重新开始</button>
  </div>
</div>

<script>
if(location.protocol === 'file:'){
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="background:#A5493A;color:#fff;padding:14px 20px;font-family:monospace;font-size:13px;line-height:1.6;">⚠️ 检测到这个页面是直接双击打开的（file://），Web Serial 在这种情况下连不上设备。请通过本地服务器或 GitHub Pages 打开，例如在这个文件夹里运行 <code>python3 -m http.server 8000</code>，然后浏览器访问 http://localhost:8000</div>'
  );
}

const $ = id => document.getElementById(id);

// ---------------- serial connection ----------------
let port = null;
let keepReading = true;
let tiltX = 0, tiltY = 0; // 最新的倾斜读数（来自加速度计x/y）

async function connectSerial(){
  if(!('serial' in navigator)){
    $('connectError').innerHTML = '<div class="error-box">这个浏览器不支持Web Serial，请换Chrome或Edge浏览器打开这个页面。</div>';
    return;
  }
  try{
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    $('connectStatus').innerHTML = ' <span style="color:#3E7A54;font-weight:600;">✓ 已连接，开始倾斜吧！</span>';
    $('connectBtn').disabled = true;
    readLoop();
    requestAnimationFrame(tick);
  }catch(err){
    $('connectError').innerHTML = `<div class="error-box">连接失败：${err.message}</div>`;
  }
}

async function readLoop(){
  const textDecoder = new TextDecoderStream();
  port.readable.pipeTo(textDecoder.writable);
  const reader = textDecoder.readable.getReader();
  let lineBuf = '';
  while(keepReading){
    const { value, done } = await reader.read();
    if(done) break;
    lineBuf += value;
    const lines = lineBuf.split('\n');
    lineBuf = lines.pop();
    for(const line of lines) handleLine(line.trim());
  }
}

function handleLine(line){
  if(!line || line.startsWith('IMU_')) return;
  const parts = line.split(',');
  if(parts.length !== 3) return;
  const x = parseFloat(parts[0]), y = parseFloat(parts[1]);
  if(Number.isNaN(x) || Number.isNaN(y)) return;
  // 板子平放时 x,y 接近0；往某个方向歪，对应轴的读数会朝1靠近
  tiltX = x;
  tiltY = y;
}

// ---------------- game ----------------
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 500, H = 500;
const BALL_R = 16;
const GOAL_R = 22;
const goal = { x: 420, y: 90 };

let ball = { x: 80, y: 410, vx: 0, vy: 0 };
let won = false;

// 一些简单的墙（矩形），做出一点"迷宫"的感觉
const walls = [
  { x: 160, y: 0,   w: 20, h: 340 },
  { x: 320, y: 160, w: 20, h: 340 },
];

function resetBall(){
  ball = { x: 80, y: 410, vx: 0, vy: 0 };
  won = false;
  $('statusText').className = 'status';
  $('statusText').textContent = '连接板子后，慢慢倾斜它试试看';
}

function circleRectCollide(cx, cy, r, rect){
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - closestX, dy = cy - closestY;
  return (dx*dx + dy*dy) < r*r;
}

function tick(){
  if(!won){
    // 板子的 x,y 加速度读数（单位g）代表重力沿这两个轴的分量，
    // 直接拿来当"这个方向的推力"，跟真实滚球托盘是同一个物理道理
    ball.vx += tiltX * 0.6;
    ball.vy += tiltY * 0.6;
    ball.vx *= 0.94; // 摩擦力，不然球会越滚越快停不下来
    ball.vy *= 0.94;

    let nx = ball.x + ball.vx;
    let ny = ball.y + ball.vy;

    // 边界反弹
    if(nx < BALL_R){ nx = BALL_R; ball.vx *= -0.4; }
    if(nx > W-BALL_R){ nx = W-BALL_R; ball.vx *= -0.4; }
    if(ny < BALL_R){ ny = BALL_R; ball.vy *= -0.4; }
    if(ny > H-BALL_R){ ny = H-BALL_R; ball.vy *= -0.4; }

    // 撞墙反弹（简单处理：分别检查x/y方向）
    for(const w of walls){
      if(circleRectCollide(nx, ball.y, BALL_R, w)) { nx = ball.x; ball.vx *= -0.4; }
      if(circleRectCollide(ball.x, ny, BALL_R, w)) { ny = ball.y; ball.vy *= -0.4; }
    }

    ball.x = nx; ball.y = ny;

    const dGoal = Math.hypot(ball.x-goal.x, ball.y-goal.y);
    if(dGoal < GOAL_R){
      won = true;
      $('statusText').className = 'status win';
      $('statusText').textContent = '🎉 到达终点！点"重新开始"再来一次';
    }
  }

  draw();
  requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 墙
  ctx.fillStyle = '#8A959A';
  walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));
  // 终点
  ctx.beginPath();
  ctx.fillStyle = '#D9A94F';
  ctx.arc(goal.x, goal.y, GOAL_R, 0, Math.PI*2);
  ctx.fill();
  // 球
  ctx.beginPath();
  ctx.fillStyle = '#7A5A20';
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
  ctx.fill();
}

draw();
</script>
</body>
</html>
